<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#050505"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F3FF"/>
      <stop offset="50%" style="stop-color:#FF00FF"/>
      <stop offset="100%" style="stop-color:#00FF88"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Border glow -->
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.5"/>

  <!-- Swipe card shape -->
  <g filter="url(#glow)">
    <!-- Card -->
    <rect x="120" y="100" width="272" height="312" rx="24" fill="#0f1115" stroke="#00F3FF" stroke-width="3"/>

    <!-- YES arrow (right) -->
    <path d="M340 256 L380 256 L360 236 M380 256 L360 276" fill="none" stroke="#00FF88" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- NO arrow (left) -->
    <path d="M172 256 L132 256 L152 236 M132 256 L152 276" fill="none" stroke="#FF0044" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Question mark -->
    <text x="256" y="220" font-family="Arial Black" font-size="80" fill="#00F3FF" text-anchor="middle" dominant-baseline="middle">?</text>

    <!-- YES/NO indicators -->
    <text x="200" y="300" font-family="Arial Black" font-size="24" fill="#00FF88" text-anchor="middle">YES</text>
    <text x="312" y="300" font-family="Arial Black" font-size="24" fill="#FF0044" text-anchor="middle">NO</text>
  </g>

  <!-- S logo at bottom -->
  <text x="256" y="460" font-family="Arial Black" font-size="48" fill="url(#glowGrad)" text-anchor="middle" filter="url(#glow)">SAGA</text>
</svg>
